<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunPay Tools Source</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'SF Mono', Monaco, monospace; 
            background: #0d1117; 
            color: #c9d1d9; 
            line-height: 1.6;
        }
        .header { 
            position: sticky; top: 0; z-index: 100;
            background: #161b22; 
            border-bottom: 1px solid #30363d;
            padding: 15px 20px;
        }
        .header h1 { font-size: 18px; color: #58a6ff; margin-bottom: 10px; }
        .search-box { display: flex; gap: 10px; }
        #search { 
            flex: 1; padding: 8px 12px; 
            background: #0d1117; border: 1px solid #30363d; 
            color: #c9d1d9; border-radius: 6px; font-size: 14px;
        }
        #search:focus { outline: none; border-color: #58a6ff; }
        .stats { 
            padding: 10px 20px; 
            background: #161b22; 
            border-bottom: 1px solid #30363d;
            font-size: 12px; color: #8b949e;
        }
        .file-list { padding: 10px 20px; }
        .file-item { 
            margin: 8px 0; 
            background: #161b22; 
            border: 1px solid #30363d;
            border-radius: 8px; overflow: hidden;
        }
        .file-header { 
            padding: 12px 15px; 
            background: #21262d;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .file-header:hover { background: #30363d; }
        .file-name { color: #58a6ff; font-weight: 600; font-size: 14px; }
        .file-meta { color: #8b949e; font-size: 12px; }
        .file-content { 
            display: none;
            padding: 15px; 
            background: #0d1117;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        .file-content.active { display: block; }
        .file-content pre { 
            white-space: pre-wrap; word-wrap: break-word;
            font-size: 13px; line-height: 1.5;
        }
        .line-num { 
            display: inline-block; width: 40px; 
            color: #484f58; text-align: right; 
            margin-right: 15px; user-select: none;
        }
        .highlight { background: #ffd700; color: #000; padding: 0 2px; border-radius: 2px; }
        .loading { text-align: center; padding: 40px; color: #8b949e; }
        .error { color: #f85149; padding: 20px; }
        .btn { 
            padding: 6px 12px; background: #238636; color: #fff; 
            border: none; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .btn:hover { background: #2ea043; }
        .filter-btns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-btn { 
            padding: 4px 10px; background: #21262d; 
            border: 1px solid #30363d; color: #8b949e;
            border-radius: 20px; cursor: pointer; font-size: 12px;
        }
        .filter-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 FunPay Tools — Source Code Viewer</h1>
        <div class="search-box">
            <input type="text" id="search" placeholder="Поиск по всем файлам... (Ctrl+F)" autocomplete="off">
            <button class="btn" onclick="expandAll()">Развернуть всё</button>
            <button class="btn" onclick="collapseAll()">Свернуть всё</button>
        </div>
    </div>
    
    <div class="stats" id="stats">
        <div class="filter-btns" id="filters"></div>
        <span id="stat-text">Загрузка...</span>
    </div>
    
    <div class="file-list" id="files">
        <div class="loading">⏳ Загрузка файлов из репозитория...</div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════
        // НАСТРОЙКИ — ЗАМЕНИ НА СВОИ
        // ═══════════════════════════════════════════════════════
        const CONFIG = {
            owner: 'proggmer',      // ← твой GitHub username
            repo: 'FPT-1.3',       // ← название репозитория
            branch: 'main',          // ← ветка (main или master)
            // Или если репозиторий приватный — используй raw URL:
            // rawBase: 'https://raw.githubusercontent.com/ТВОЙ_НИК/ТВОЙ_РЕПО/main/'
        };
        
        // Расширения файлов для отображения
        const CODE_EXTS = ['.kt', '.java', '.js', '.xml', '.md', '.gradle', '.kts', '.properties', '.json', '.yml', '.yaml', '.txt', '.html', '.css', '.cpp', '.h', '.c'];
        
        let allFiles = [];
        let fileContents = {};
        
        // ═══════════════════════════════════════════════════════
        // GitHub API — получение дерева файлов
        // ═══════════════════════════════════════════════════════
        async function loadRepo() {
            const filesDiv = document.getElementById('files');
            
            try {
                // Получаем дерево файлов репозитория
                const treeUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
                const response = await fetch(treeUrl);
                
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status} — проверь owner/repo в CONFIG`);
                }
                
                const data = await response.json();
                
                // Фильтруем только файлы с нужными расширениями
                allFiles = data.tree
                    .filter(item => item.type === 'blob')
                    .filter(item => CODE_EXTS.some(ext => item.path.endsWith(ext)))
                    .sort((a, b) => a.path.localeCompare(b.path));
                
                renderFileList();
                updateStats();
                
                // Предзагружаем первые 5 файлов
                allFiles.slice(0, 5).forEach(f => loadFileContent(f.path));
                
            } catch (err) {
                filesDiv.innerHTML = `<div class="error">❌ Ошибка: ${err.message}<br><br>
                    Проверь настройки CONFIG в начале файла.<br>
                    Убедись что репозиторий публичный, или используй токен.</div>`;
            }
        }
        
        // ═══════════════════════════════════════════════════════
        // Загрузка содержимого файла через raw.githubusercontent
        // ═══════════════════════════════════════════════════════
        async function loadFileContent(path) {
            if (fileContents[path]) return fileContents[path];
            
            const rawUrl = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`;
            
            try {
                const response = await fetch(rawUrl);
                if (!response.ok) throw new Error('Failed to load');
                const content = await response.text();
                fileContents[path] = content;
                return content;
            } catch (err) {
                return `// Ошибка загрузки: ${err.message}`;
            }
        }
        
        // ═══════════════════════════════════════════════════════
        // Отображение списка файлов
        // ═══════════════════════════════════════════════════════
        function renderFileList(filter = '') {
            const filesDiv = document.getElementById('files');
            const search = filter.toLowerCase();
            
            const filtered = allFiles.filter(f => {
                if (!search) return true;
                const content = fileContents[f.path] || '';
                return f.path.toLowerCase().includes(search) || 
                       content.toLowerCase().includes(search);
            });
            
            if (filtered.length === 0) {
                filesDiv.innerHTML = '<div class="loading">Ничего не найдено</div>';
                return;
            }
            
            filesDiv.innerHTML = filtered.map(file => {
                const ext = file.path.split('.').pop();
                const lines = fileContents[file.path] ? fileContents[file.path].split('\n').length : '?';
                const size = formatBytes(file.size);
                
                return `
                    <div class="file-item" data-path="${file.path}">
                        <div class="file-header" onclick="toggleFile('${file.path}')">
                            <div>
                                <span class="file-name">${escapeHtml(file.path)}</span>
                                <span class="file-meta"> • ${ext.toUpperCase()} • ${size} • ${lines} строк</span>
                            </div>
                            <span style="color: #8b949e;">▼</span>
                        </div>
                        <div class="file-content" id="content-${hashPath(file.path)}">
                            <div class="loading">⏳ Загрузка...</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Обновляем счётчик найденного
            document.getElementById('stat-text').textContent = 
                `Показано: ${filtered.length} из ${allFiles.length} файлов`;
        }
        
        // ═══════════════════════════════════════════════════════
        // Переключение файла
        // ═══════════════════════════════════════════════════════
        async function toggleFile(path) {
            const contentDiv = document.getElementById(`content-${hashPath(path)}`);
            const isActive = contentDiv.classList.contains('active');
            
            if (isActive) {
                contentDiv.classList.remove('active');
                return;
            }
            
            // Загружаем если ещё не загружен
            if (!fileContents[path]) {
                contentDiv.innerHTML = '<div class="loading">⏳ Загрузка...</div>';
                await loadFileContent(path);
            }
            
            // Подсвечиваем поиск если есть
            const search = document.getElementById('search').value.toLowerCase();
            const content = fileContents[path] || '';
            
            contentDiv.innerHTML = `<pre>${highlightCode(content, path, search)}</pre>`;
            contentDiv.classList.add('active');
            
            // Прокрутка к первому совпадению
            if (search) {
                setTimeout(() => {
                    const firstHighlight = contentDiv.querySelector('.highlight');
                    if (firstHighlight) {
                        firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }
        
        // ═══════════════════════════════════════════════════════
        // Подсветка синтаксиса + поиск
        // ═══════════════════════════════════════════════════════
        function highlightCode(code, path, searchTerm) {
            const lines = code.split('\n');
            let result = '';
            
            lines.forEach((line, i) => {
                let processed = escapeHtml(line);
                
                // Подсветка поиска
                if (searchTerm) {
                    const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
                    processed = processed.replace(regex, '<span class="highlight">$1</span>');
                }
                
                result += `<span class="line-num">${i + 1}</span>${processed}\n`;
            });
            
            return result;
        }
        
        // ═══════════════════════════════════════════════════════
        // Фильтры по расширениям
        // ═══════════════════════════════════════════════════════
        function renderFilters() {
            const exts = [...new Set(allFiles.map(f => f.path.split('.').pop()))].sort();
            const container = document.getElementById('filters');
            
            container.innerHTML = [
                '<button class="filter-btn active" onclick="filterByExt(\'\')">Все</button>',
                ...exts.map(ext => `<button class="filter-btn" onclick="filterByExt('${ext}')">.${ext}</button>`)
            ].join('');
        }
        
        let currentExtFilter = '';
        
        function filterByExt(ext) {
            currentExtFilter = ext;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', 
                    (ext === '' && btn.textContent === 'Все') || btn.textContent === `.${ext}`
                );
            });
            applyFilters();
        }
        
        // ═══════════════════════════════════════════════════════
        // Поиск
        // ═══════════════════════════════════════════════════════
        let searchTimeout;
        document.getElementById('search').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => applyFilters(), 300);
        });
        
        async function applyFilters() {
            const search = document.getElementById('search').value.toLowerCase();
            
            // Если поиск по содержимому — предзагружаем все файлы
            if (search.length > 2) {
                const unloaded = allFiles.filter(f => !fileContents[f.path]);
                document.getElementById('stat-text').textContent = `Загрузка ${unloaded.length} файлов для поиска...`;
                
                // Загружаем пачками по 5
                for (let i = 0; i < unloaded.length; i += 5) {
                    const batch = unloaded.slice(i, i + 5);
                    await Promise.all(batch.map(f => loadFileContent(f.path)));
                    document.getElementById('stat-text').textContent = 
                        `Загружено ${i + batch.length} из ${unloaded.length}...`;
                }
            }
            
            renderFileList(search);
        }
        
        // ═══════════════════════════════════════════════════════
        // Утилиты
        // ═══════════════════════════════════════════════════════
        function hashPath(path) {
            return path.replace(/[^a-zA-Z0-9]/g, '_');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        
        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        function expandAll() {
            allFiles.forEach(f => {
                const div = document.getElementById(`content-${hashPath(f.path)}`);
                if (!div.classList.contains('active')) toggleFile(f.path);
            });
        }
        
        function collapseAll() {
            document.querySelectorAll('.file-content').forEach(el => el.classList.remove('active'));
        }
        
        function updateStats() {
            renderFilters();
            const totalSize = allFiles.reduce((sum, f) => sum + f.size, 0);
            document.getElementById('stat-text').textContent = 
                `Всего файлов: ${allFiles.length} | Общий размер: ${formatBytes(totalSize)}`;
        }
        
        // Горячие клавиши
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('search').focus();
            }
        });
        
        // Старт
        loadRepo();
    </script>
</body>
</html>
